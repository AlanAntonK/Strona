<script>
/* =========================================================
   FOTOS HIER EINTRAGEN
   1. Foto in den Ordner "galerie/" im Repository hochladen
      (Dateiname ohne Leerzeichen, z. B. sprachbruecken-2026.jpg)
   2. Unten einen neuen Block { ... } hinzufügen
   - date: optional, z. B. "03.2024" (oder "" lassen)
   - de / en / pl: Bildunterschrift in der jeweiligen Sprache
   Die Reihenfolge hier = Reihenfolge auf der Seite.
   ========================================================= */
var PHOTOS = [
  {
    src: "alan-kies-foto.png",
    date: "2026",
    de: "Bewerbungsfoto",
    en: "Professional portrait",
    pl: "Zdjęcie portretowe"
  }
  // ,{
  //   src: "galerie/sprachbruecken-2026.jpg",
  //   date: "05.2026",
  //   de: "Deutsch-polnische Sprachbrücken an der SGH",
  //   en: "German-Polish “Sprachbrücken” language exchange at SGH",
  //   pl: "Polsko-niemieckie spotkania językowe „Sprachbrücken” w SGH"
  // }
];

window.I18N = {
  en: {
    _title: "Gallery – Alan Kieś",
    nav_about: "About", nav_edu: "Education", nav_exp: "Experience", nav_gallery: "Gallery", nav_contact: "Contact",
    g_eye: "Gallery", g_h: "Moments &amp; Projects",
    g_p: "Impressions from my studies, events and student activities.",
    g_empty: "No photos yet.",
    ft_home: "Home", ft_privacy: "Privacy"
  },
  pl: {
    _title: "Galeria – Alan Kieś",
    nav_about: "O mnie", nav_edu: "Wykształcenie", nav_exp: "Doświadczenie", nav_gallery: "Galeria", nav_contact: "Kontakt",
    g_eye: "Galeria", g_h: "Chwile i projekty",
    g_p: "Wrażenia ze studiów, wydarzeń i działalności studenckiej.",
    g_empty: "Na razie brak zdjęć.",
    ft_home: "Strona główna", ft_privacy: "Prywatność"
  },
  de: { g_empty: "Noch keine Fotos vorhanden." }
};

(function () {
  var grid = document.getElementById('gallery');
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var lbCap = document.getElementById('lb-cap');
  var current = 0;

  function lang() { return window.currentLang || 'de'; }
  function caption(p) { return p[lang()] || p.de || ''; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render() {
    if (!PHOTOS.length) {
      var t = (window.I18N[lang()] || {}).g_empty || window.I18N.de.g_empty;
      grid.innerHTML = '<div class="empty">' + t + '</div>';
      return;
    }
    grid.innerHTML = PHOTOS.map(function (p, i) {
      return '<figure class="shot" tabindex="0" data-i="' + i + '">' +
        '<img src="' + esc(p.src) + '" alt="' + esc(caption(p)) + '" loading="lazy">' +
        '<figcaption>' + (p.date ? '<b>' + esc(p.date) + '</b>' : '') + esc(caption(p)) + '</figcaption>' +
        '</figure>';
    }).join('');
  }

  function show(i) {
    current = (i + PHOTOS.length) % PHOTOS.length;
    var p = PHOTOS[current];
    lbImg.src = p.src; lbImg.alt = caption(p);
    lbCap.textContent = (p.date ? p.date + ' · ' : '') + caption(p);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function hide() { lb.classList.remove('open'); document.body.style.overflow = ''; }

  grid.addEventListener('click', function (e) {
    var f = e.target.closest('.shot'); if (f) show(+f.getAttribute('data-i'));
  });
  grid.addEventListener('keydown', function (e) {
    var f = e.target.closest('.shot'); if (f && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); show(+f.getAttribute('data-i')); }
  });
  document.getElementById('lb-close').onclick = hide;
  document.getElementById('lb-prev').onclick = function () { show(current - 1); };
  document.getElementById('lb-next').onclick = function () { show(current + 1); };
  lb.addEventListener('click', function (e) { if (e.target === lb) hide(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') hide();
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });

  document.addEventListener('langchange', render);
  render();
})();
</script>
<script src="i18n.js?v=4"></script>
</body>
</html>
